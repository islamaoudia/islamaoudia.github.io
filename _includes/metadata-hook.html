<style>
  html[data-lang="en"] .lang-fr,
  html[data-lang="fr"] .lang-en { display: none !important; }

  #lang-switcher {
    position: fixed;
    top: 3.5rem;
    right: 1rem;
    z-index: 9999;
    display: inline-flex;
    align-items: center;
    gap: 2px;
    background: rgba(30, 30, 30, 0.9);
    border: 1px solid #444;
    border-radius: 6px;
    padding: 2px 4px;
    backdrop-filter: blur(4px);
    font-size: 0.72rem;
    font-weight: 600;
  }
  #lang-switcher button {
    background: transparent;
    border: none;
    color: #888;
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 4px;
    line-height: 1.2;
  }
  #lang-switcher button.active {
    background: #3a3a3a;
    color: #fff;
  }
</style>

<script>
(function () {
  var stored = 'en';
  try { stored = localStorage.getItem('site-lang') || 'en'; } catch (e) {}
  document.documentElement.setAttribute('data-lang', stored === 'fr' ? 'fr' : 'en');
})();
</script>

<script>
document.addEventListener('DOMContentLoaded', function () {
  var dict = {
    fr: {
      'HOME': 'ACCUEIL',
      'CATEGORIES': 'CATÉGORIES',
      'TAGS': 'TAGS',
      'ARCHIVES': 'ARCHIVES',
      'ABOUT': 'À PROPOS',
      'PROJECTS': 'PROJETS',
      'About': 'À propos',
      'Projects': 'Projets',
      'Categories': 'Catégories',
      'Archives': 'Archives',
      'Recently Updated': 'Mis à jour récemment',
      'Trending Tags': 'Tags populaires',
      'Cybersecurity Student • Pwn CTF Player': 'Étudiant en Cybersécurité • Joueur CTF Pwn'
    }
  };

  var switcher = document.createElement('div');
  switcher.id = 'lang-switcher';
  switcher.innerHTML = '<button id="sw-en">EN</button><button id="sw-fr">FR</button>';
  document.body.appendChild(switcher);

  var uiNodes = [].concat(
    Array.from(document.querySelectorAll('#sidebar ul.nav li a span')),
    Array.from(document.querySelectorAll('p.site-subtitle')),
    Array.from(document.querySelectorAll('h1.dynamic-title')),
    Array.from(document.querySelectorAll('#panel-wrapper h2.panel-heading'))
  ).map(function (el) {
    return { el: el, orig: el.textContent.trim() };
  });

  var swEn = document.getElementById('sw-en');
  var swFr = document.getElementById('sw-fr');
  var search = document.getElementById('search-input');

  function applyLang(lang) {
    try { localStorage.setItem('site-lang', lang); } catch (e) {}

    document.documentElement.setAttribute('data-lang', lang);
    swEn.classList.toggle('active', lang === 'en');
    swFr.classList.toggle('active', lang === 'fr');

    for (var i = 0; i < uiNodes.length; i++) {
      var n = uiNodes[i];
      var tr = lang === 'fr' ? dict.fr[n.orig] : null;
      if (n.el.textContent !== (tr || n.orig)) n.el.textContent = tr || n.orig;
    }

    if (search) search.placeholder = lang === 'fr' ? 'Rechercher...' : 'Search...';
  }

  swEn.addEventListener('click', function () { applyLang('en'); });
  swFr.addEventListener('click', function () { applyLang('fr'); });

  var initial = document.documentElement.getAttribute('data-lang') || 'en';
  swEn.classList.toggle('active', initial === 'en');
  swFr.classList.toggle('active', initial === 'fr');
  applyLang(initial);
});
</script>
